[project]
name = "mixray-engine"
version = "0.1.0"
description = "Mixray engine: Modal app for ingest, isolation, analysis and transcription."
requires-python = "==3.11.*"
dependencies = [
  "fastapi==0.162.0",
  # `suggest` calls the Meta Responses API and needs per-request timeouts and retries.
  "httpx==0.28.1",
  # Meta's own parser for the SAM 3 segmentation protocol. The mask payload is base85 in a variant
  # the docs do not name, and this is the first-party decoder for it; it has no dependencies.
  "meta-sam-parser==0.1.0",
  "modal==1.6.2",
]

[dependency-groups]
# librosa 1.0.0 requires Python >= 3.12 and the engine is pinned to 3.11 for Basic Pitch, so this
# is the newest release that still supports 3.11. It lives in its own group because only the
# `analyze` image needs it; the API container should not pay its import cost on every cold start.
analyze = [
  "librosa==0.11.0",
  "soundfile==0.14.0",
]
dev = [
  # Validates what the engine serves against schema/trackmap.schema.json, the contract with the web.
  "jsonschema==4.26.0",
  # The note metric in evaluation/scoring.py, unit-tested with the engine's tests.
  "mir_eval==0.8.2",
  "mypy==2.4.0",
  "pytest==9.2.0",
  "ruff==0.17.2",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"
# Notebook cells kept exactly as they ran; they lean on state from earlier cells.
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "ANN", "N", "SIM", "RET", "PL", "RUF"]
# Heavy model libraries are imported inside Modal functions on purpose (AGENTS.md: the container
# only pays for them when the function runs), so a function-local import is the convention here.
ignore = ["PLC0415"]

[tool.ruff.lint.per-file-ignores]
# A test reads best with the literal value it expects.
"tests/*" = ["PLR2004"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "../evaluation"]
addopts = "-ra"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
exclude = ["/notebooks/"]

[[tool.mypy.overrides]]
module = ["torch.*", "torchaudio.*", "sam_audio.*", "librosa.*", "jsonschema.*", "mir_eval.*", "pretty_midi.*", "soundfile.*"]
ignore_missing_imports = true
