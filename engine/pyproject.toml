[project]
name = "mixray-engine"
version = "0.1.0"
description = "Mixray engine: Modal app for ingest, isolation, analysis and transcription."
requires-python = "==3.11.*"
dependencies = [
  "fastapi==0.162.0",
  "modal==1.6.2",
]

[dependency-groups]
dev = [
  "mypy==2.4.0",
  "ruff==0.17.2",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "ANN", "N", "SIM", "RET", "PL", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
