name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: TrackMap types match the schema
        working-directory: apps/web
        run: pnpm gen:types && git diff --exit-code lib/trackmap/trackmap.generated.ts
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  engine:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Install ffmpeg, which the upload tests run for real
        run: sudo apt-get update && sudo apt-get install --yes ffmpeg
      - run: uv sync --locked --all-groups
      - run: uv run ruff format --check . ../evaluation --config pyproject.toml
      - run: uv run ruff check . ../evaluation --config pyproject.toml
      - run: uv run mypy . ../evaluation
        env:
          MYPYPATH: ../evaluation
      - run: uv run pytest
      - run: uv run python transcribe.fixture.py
